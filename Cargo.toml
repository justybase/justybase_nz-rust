[package]
name = "nz_rust"
version = "0.3.3"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Krzysztof Duśko"]
repository = "https://github.com/justybase/justybase_nz-rust"
homepage = "https://github.com/justybase/justybase_nz-rust"
documentation = "https://docs.rs/nz_rust"
description = "Pure Rust driver for IBM Netezza / PureData — port of JustyBase.NetezzaDriver (C#) and @justybase/netezza-driver (Node/TS)"
readme = "README.md"
keywords = ["netezza", "database", "sql", "driver", "tokio"]
categories = ["database", "asynchronous"]
exclude = [
    "benchmarks/**",
    "fuzz/**",
    "examples/nz-editor/**",
    "AGENTS.md",
    "QUALITY_REPORT.md",
    ".github/**",
    ".agents/**",
    ".codex/**",
]

[features]
default = []
compat = []
chrono = ["dep:chrono"]
ssl = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]

[dependencies]
bytes = "1.12"
hashbrown = "0.17.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
futures-core = "0.3.34"
md5 = "0.8"
sha2 = "0.11"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23.45", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
tokio-rustls = { version = "0.26.5", optional = true }
webpki-roots = { version = "1.0.9", optional = true }

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["miniz_oxide"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[test]]
name = "compatibility_matrix"
path = "tests/compatibility_matrix.rs"
required-features = ["compat"]

[[test]]
name = "live_driver"
path = "tests/live_driver.rs"
required-features = ["compat"]

[[test]]
name = "live_integration"
path = "tests/live_integration.rs"
required-features = ["compat"]

[[test]]
name = "mock_server"
path = "tests/mock_server.rs"
required-features = ["compat"]

[[test]]
name = "native_async"
path = "tests/native_async.rs"

[[test]]
name = "nzpy_extended_performance"
path = "tests/nzpy_extended_performance.rs"
required-features = ["compat"]

[[test]]
name = "perf_fact200k"
path = "tests/perf_fact200k.rs"

[[example]]
name = "cross_driver_compat"
path = "examples/cross_driver_compat.rs"
required-features = ["compat"]

[[example]]
name = "dump_to_txt"
path = "examples/dump_to_txt.rs"
required-features = ["compat"]

[[example]]
name = "netezza_bench"
path = "examples/netezza_bench.rs"
required-features = ["compat"]
