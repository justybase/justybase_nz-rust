name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Rust stable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p nz_rust --all-targets --all-features --locked
      - run: cargo clippy -p nz_rust --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The fuzz crate is a separate workspace; make sure its targets keep
      # compiling (campaigns run locally with cargo-fuzz, see fuzz/README.md).
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Verify published package contents
        shell: bash
        run: |
          set -euo pipefail
          package_list="$RUNNER_TEMP/package-files.txt"
          cargo package --locked --list > "$package_list"
          ! grep -E '^(benchmarks/|examples/nz-editor/|AGENTS\.md$|\.github/|\.agents/|\.codex/)' "$package_list"
      - name: Verify the package builds and publishes (dry run)
        run: |
          cargo package --locked
          cargo publish --dry-run --locked

  cross-platform:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p nz_rust --all-targets --all-features --locked

  dependency-policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  features:
    name: Feature set ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ssl", "chrono", "compat", "ssl,chrono,compat"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --no-default-features --features "${{ matrix.features }}" --locked
      # --all-targets skips doctests; run them for every feature set too.
      - run: cargo test --doc --no-default-features --features "${{ matrix.features }}" --locked

  msrv:
    name: Rust MSRV 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check -p nz_rust --all-targets --all-features --locked

  # Coverage is enforced at 70% of lines with all features enabled. The gate is
  # deliberately below the current ~74% so ordinary refactors have headroom
  # while a real regression in protocol coverage fails the job.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
      - name: Summarize coverage and enforce the line gate
        run: |
          cargo llvm-cov report --summary-only --fail-under-lines 70 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
