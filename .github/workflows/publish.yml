name: Publish crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packaging without publishing to crates.io
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release tag is published only after the same checks that protect main
  # pass for the tagged commit. This job deliberately does not reuse the CI
  # workflow result: tag pushes do not run CI, and a green branch run is not
  # proof that the exact release tree is valid.
  verify:
    name: Verify release tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nz_rust") | .version')
          test "v$version" = "$GITHUB_REF_NAME"

      - run: cargo fmt --all -- --check
      - run: cargo test -p nz_rust --all-targets --all-features --locked
      - run: cargo clippy -p nz_rust --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          package_list="$RUNNER_TEMP/package-files.txt"
          cargo package --locked --list > "$package_list"
          ! grep -E '^(benchmarks/|examples/nz-editor/|AGENTS\.md$|\.github/|\.agents/|\.codex/)' "$package_list"

      - name: Verify package builds and publishes (dry run)
        run: |
          cargo package --locked
          cargo publish --dry-run --locked

  publish:
    name: Publish nz_rust
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io token
        if: github.event_name == 'push' || inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Publish to crates.io
        if: github.event_name == 'push' || inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
